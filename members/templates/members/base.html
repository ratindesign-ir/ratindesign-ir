<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}سامانه اعضا{% endblock %}</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; margin: 2rem auto; max-width: 960px; line-height: 1.8; color: #1f2937; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 1rem; }
    a { color: #2563eb; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e5e7eb; padding: .5rem; text-align: right; }
    th { background: #f3f4f6; }
    .card { border: 1px solid #e5e7eb; border-radius: .75rem; padding: 1rem; margin: 1rem 0; }
    .summary { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .amount { font-weight: bold; font-size: 1.2rem; }
    .messages { padding: 0; list-style: none; }
    .messages li { background: #ecfdf5; border: 1px solid #a7f3d0; padding: .75rem; border-radius: .5rem; margin-bottom: .5rem; }
    form p { display: grid; gap: .35rem; }
    input, select, button { padding: .5rem; font: inherit; }
    button { cursor: pointer; background: #2563eb; color: white; border: 0; border-radius: .5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">خانه</a>
    {% if user.is_authenticated %}
      <a href="{% url 'member_profile' %}">پروفایل من</a>
      <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button type="submit" style="padding:.1rem .5rem">خروج</button></form>
    {% else %}
      <a href="{% url 'login' %}">ورود</a>
      <a href="{% url 'signup' %}">عضویت</a>
    {% endif %}
    <a href="/admin/">ادمین</a>
  </nav>
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
